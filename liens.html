<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JO BAND | Nos liens</title>
<meta name="description" content="Contactez JO BAND, regardez nos vidéos et suivez notre chaîne WhatsApp.">
<meta name="theme-color" content="#0b0f1c">
<meta name="robots" content="noindex">
<style>
:root{--bg:#0b0f1c;--gold:#e8be4f;--gold2:#c99a2a;--text:#f6efd9;--muted:#a3abc4}
*{-webkit-box-sizing:border-box;box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);position:relative;overflow-x:hidden;-webkit-text-size-adjust:100%}

/* Projecteur de scène */
.stage{position:absolute;top:0;left:0;right:0;height:560px;pointer-events:none;overflow:hidden}
.beam{position:absolute;top:-20px;left:50%;width:640px;margin-left:-320px;height:520px;background:-webkit-linear-gradient(top,rgba(232,190,79,.30),rgba(232,190,79,.07) 55%,rgba(232,190,79,0));background:linear-gradient(180deg,rgba(232,190,79,.30),rgba(232,190,79,.07) 55%,rgba(232,190,79,0));-webkit-clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);-webkit-filter:blur(14px);filter:blur(14px)}
.pool{position:absolute;top:140px;left:50%;width:520px;margin-left:-260px;height:340px;border-radius:50%;background:-webkit-radial-gradient(center,rgba(40,86,170,.55),rgba(11,15,28,0) 68%);background:radial-gradient(closest-side,rgba(40,86,170,.55),rgba(11,15,28,0) 68%)}

main{position:relative;width:100%;max-width:430px;margin:0 auto;padding:34px 18px 26px;text-align:center}

.logo{display:block;margin:0 auto;width:190px;-webkit-mask-image:-webkit-radial-gradient(center,ellipse closest-side,#000 88%,rgba(0,0,0,0) 100%);mask-image:radial-gradient(ellipse closest-side,#000 88%,rgba(0,0,0,0) 100%);height:auto;mix-blend-mode:lighten;-webkit-filter:drop-shadow(0 12px 26px rgba(232,190,79,.22));filter:drop-shadow(0 12px 26px rgba(232,190,79,.22))}
h1{margin-top:2px;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:2.15rem;letter-spacing:.07em;line-height:1.1;color:#fff}
.tag{margin-top:10px;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:1.02rem;color:var(--gold);line-height:1.4}
.who{margin-top:8px;font-size:.86rem;color:var(--muted)}

.links{margin-top:30px}
.btn{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;position:relative;overflow:hidden;width:100%;margin-bottom:13px;padding:12px 16px 12px 12px;min-height:70px;border-radius:20px;text-decoration:none;color:var(--text);text-align:left;background:-webkit-linear-gradient(top,rgba(255,255,255,.075),rgba(255,255,255,.03));background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));border:1px solid rgba(232,190,79,.30);-webkit-box-shadow:0 10px 24px -12px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08);box-shadow:0 10px 24px -12px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08);-webkit-tap-highlight-color:transparent;-webkit-transition:-webkit-transform .15s;transition:transform .15s}
.btn:active{-webkit-transform:scale(.97);transform:scale(.97)}
.ico{-webkit-flex:none;flex:none;width:46px;height:46px;border-radius:14px;margin-right:14px;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;background:rgba(255,255,255,.08)}
.ico svg{width:26px;height:26px;display:block}
.txt{-webkit-box-flex:1;-webkit-flex:1;flex:1;min-width:0}
.txt b{display:block;font-size:1.06rem;font-weight:700;line-height:1.25}
.txt small{display:block;margin-top:3px;font-size:.8rem;line-height:1.3;color:var(--muted)}
.chev{-webkit-flex:none;flex:none;width:9px;height:9px;margin:0 6px 0 10px;border-top:2.5px solid var(--gold);border-right:2.5px solid var(--gold);-webkit-transform:rotate(45deg);transform:rotate(45deg);opacity:.9}

.btn.main{min-height:84px;border:none;color:#1b1405;background:-webkit-linear-gradient(left,#f3cf6a,#e8be4f 45%,#c99a2a);background:linear-gradient(100deg,#f3cf6a,#e8be4f 45%,#c99a2a);-webkit-box-shadow:0 16px 34px -12px rgba(232,190,79,.55),inset 0 1px 0 rgba(255,255,255,.5);box-shadow:0 16px 34px -12px rgba(232,190,79,.55),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.main .ico{background:rgba(27,20,5,.14);width:54px;height:54px;border-radius:17px}
.btn.main .ico svg{width:32px;height:32px}
.btn.main .txt b{font-size:1.25rem}
.btn.main .txt small{color:rgba(27,20,5,.74);font-size:.84rem}
.btn.main .chev{border-color:#1b1405}
.btn.main:after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:-webkit-linear-gradient(left,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));-webkit-transform:skewX(-20deg);transform:skewX(-20deg);-webkit-animation:shine 4.5s ease-in-out 1.2s infinite;animation:shine 4.5s ease-in-out 1.2s infinite}
.yt .ico{background:rgba(255,45,45,.16)}
.wc .ico{background:rgba(37,211,102,.16)}
.web .ico{background:rgba(232,190,79,.16)}

.note{margin-top:20px;font-size:.82rem;line-height:1.5;color:var(--muted)}
.copy{margin-top:4px;background:none;border:none;color:var(--gold);font:inherit;font-size:.88rem;font-weight:600;text-decoration:underline;padding:10px;cursor:pointer}
.ok{display:none;color:#4fd08a;font-size:.82rem}
.foot{margin-top:22px;font-size:.76rem;color:#6f7893}

/* Une seule animation d'entrée, sur les boutons */
.btn{-webkit-animation:rise .55s ease both;animation:rise .55s ease both}
.btn:nth-child(2){-webkit-animation-delay:.08s;animation-delay:.08s}
.btn:nth-child(3){-webkit-animation-delay:.16s;animation-delay:.16s}
.btn:nth-child(4){-webkit-animation-delay:.24s;animation-delay:.24s}
@-webkit-keyframes rise{from{opacity:0;-webkit-transform:translateY(14px)}to{opacity:1;-webkit-transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@-webkit-keyframes shine{0%,55%{left:-60%}100%{left:130%}}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
@media (prefers-reduced-motion:reduce){.btn,.btn.main:after{-webkit-animation:none;animation:none}}
a:focus,button:focus{outline:3px solid var(--gold);outline-offset:3px}
@media (max-width:340px){h1{font-size:1.8rem}.logo{width:180px}}
</style>
</head>
