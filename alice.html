<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALICE | JO BAND</title>
    <meta name="theme-color" content="#0a192f">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="alice.css">
</head>
<body class="alice-page">

    <main class="alice-page-wrap">
        <button id="alice-fab" aria-label="Parler à ALICE">
            <img src="images/alice-avatar.png" alt="ALICE" class="alice-fab-avatar">
        </button>

        <div id="alice-widget">
            <div class="alice-overlay"></div>

            <div class="alice-scene">
                <div class="alice-bubble" id="alice-bubble">
                    Bonjour 👋 Je suis ALICE, assistante JO BAND.
                </div>

                <img
                    src="images/alice-avatar.png"
                    alt="ALICE"
                    class="alice-avatar-big"
                    id="alice-avatar-big"
                >

                <button id="alice-close" aria-label="Fermer">✕</button>
            </div>
        </div>
    </main>

    <script src="alice.js"></script>
</body>
</html>
