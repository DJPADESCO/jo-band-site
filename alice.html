<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALICE | JO BAND</title>
    <meta name="theme-color" content="#0a192f">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="alice.css">
</head>
<body class="alice-page">

    <main class="alice-page-wrap">

        <!-- BOUTON FLOTTANT -->
        <button id="alice-fab" aria-label="Parler à ALICE">
            <img src="images/alice-avatar.png" alt="ALICE" id="alice-fab-avatar">
        </button>

        <!-- WIDGET PRINCIPAL -->
        <div id="alice-widget" class="alice-live-container idle">

            <!-- EN-TÊTE -->
            <div class="alice-stage-header">
                <div class="alice-stage-title">
                    <div class="alice-live-dot"></div>
                    ALICE LIVE
                </div>
                <button id="alice-close" class="alice-stage-close" aria-label="Fermer">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- BULLE DE RÉPONSE -->
            <div class="alice-stage-main">
                <div id="alice-bubble">
                    Bonjour 👋 Je suis ALICE, l'assistante officielle de JO BAND. Comment puis-je vous aider ?
                </div>
            </div>

            <!-- ZONE DE SAISIE -->
            <div class="alice-stage-footer">
                <div class="alice-input-box">
                    <input type="text" id="alice-input"
                           placeholder="Écrivez ou parlez..."
                           maxlength="500"
                           autocomplete="off">
                    <button id="alice-mic" title="Parler" aria-label="Reconnaissance vocale">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <button id="alice-send" aria-label="Envoyer">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
                <div class="alice-brand-footer">ALICE CORE BY DJ PADESCO</div>
            </div>

        </div>
    </main>

    <script src="alice.js"></script>
</body>
</html>
