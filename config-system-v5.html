<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>404 - Page non trouvée</title>
<link rel="stylesheet" href="config-system-v5.css">
</head>
<body>

<script>
window.addEventListener('error', function(e) {
  var box = document.createElement('div');
  box.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:red;color:white;padding:10px;font-size:12px;z-index:999999999;max-height:40%;overflow:auto;';
  box.innerText = 'ERREUR JS: ' + e.message + ' | Ligne: ' + e.lineno;
  document.body.appendChild(box);
});
window.addEventListener('unhandledrejection', function(e) {
  var box = document.createElement('div');
  box.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:orange;color:black;padding:10px;font-size:12px;z-index:999999999;max-height:40%;overflow:auto;';
  box.innerText = 'ERREUR PROMESSE: ' + (e.reason && e.reason.message ? e.reason.message : JSON.stringify(e.reason));
  document.body.appendChild(box);
});
</script>

<div class="login-box">

    <div id="login-view">
        <h1>Étape 1 : Connexion</h1>
        <div class="field">
            <label for="admin-email">Email</label>
            <input type="email" id="admin-email" autocomplete="username">
        </div>
        <div class="field">
            <label for="admin-password">Mot de passe</label>
            <input type="password" id="admin-password" autocomplete="current-password">
        </div>
        <button id="btn-login" class="btn-primary">Se connecter</button>
        <p id="login-status" class="status-msg"></p>
    </div>

    <div id="totp-view" class="hidden">
        <h1>Étape 2 : Code TOTP</h1>
        <p class="subtext">Entrez le code à 6 chiffres de Google Authenticator.</p>
        <div class="field">
            <input type="text" id="totp-code" maxlength="6" placeholder="123456" class="totp-input">
        </div>
        <button id="btn-verify-totp" class="btn-primary">Vérifier</button>
        <p id="totp-status" class="status-msg"></p>
    </div>

    <div id="success-view" class="hidden">
        <h1>✅ Connexion + 2FA réussies</h1>
        <p class="subtext">Le tableau de bord sera réintégré une fois cette base validée.</p>
        <button id="btn-logout" class="btn-primary">Se déconnecter</button>
    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="config-system-v5.js"></script>

</body>
</html>
