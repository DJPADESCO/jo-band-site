<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>404 - Page non trouvée</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="config-system-v5.css">
</head>
<body>

<div id="auth-wrapper">
    <div class="login-box">
        <div id="login-view">
            <h1><i class="fa-solid fa-lock"></i> Accès restreint</h1>
            <div class="field">
                <label for="admin-email">Email</label>
                <input type="email" id="admin-email" autocomplete="username">
            </div>
            <div class="field">
                <label for="admin-password">Mot de passe</label>
                <input type="password" id="admin-password" autocomplete="current-password">
            </div>
            <button id="btn-login" class="btn-primary">Se connecter</button>
            <p id="login-status" class="status-msg"></p>
        </div>

        <div id="totp-view" class="hidden">
            <h1><i class="fa-solid fa-shield-halved"></i> Vérification</h1>
            <p class="subtext">Entrez le code à 6 chiffres de Google Authenticator.</p>
            <div class="field">
                <input type="text" id="totp-code" maxlength="6" placeholder="123456" class="totp-input">
            </div>
            <button id="btn-verify-totp" class="btn-primary">Vérifier</button>
            <p id="totp-status" class="status-msg"></p>
        </div>
    </div>
</div>

<div id="dashboard" class="hidden">

    <button id="btn-open-drawer" class="hamburger-btn" aria-label="Menu">
        <i class="fa-solid fa-bars"></i>
    </button>

    <div id="drawer-backdrop" class="drawer-backdrop"></div>

    <aside id="side-drawer" class="side-drawer">
        <div class="drawer-header">
            <span class="drawer-title">JO BAND</span>
            <span class="drawer-subtitle">Panneau Admin</span>
        </div>
        <nav class="drawer-nav">
            <button class="nav-item active" data-tab="tab-testimonials">
                <i class="fa-regular fa-comment-dots"></i> Témoignages
            </button>
            <button class="nav-item" data-tab="tab-members">
                <i class="fa-solid fa-users"></i> Collectif
            </button>
            <button class="nav-item" data-tab="tab-contact">
                <i class="fa-solid fa-phone"></i> Contact
            </button>
        </nav>
        <button id="btn-logout" class="btn-logout">
            <i class="fa-solid fa-right-from-bracket"></i> Déconnexion
        </button>
    </aside>

    <main class="main-content">
        <header class="content-header">
            <h1 id="page-title">Témoignages</h1>
        </header>

        <div id="tab-testimonials" class="tab-panel active">
            <section class="panel-block">
                <h2 class="block-title"><i class="fa-regular fa-clock"></i> En attente</h2>
                <div id="admin-testi-pending" class="item-list">
                    <p class="subtext">Chargement...</p>
                </div>
            </section>

            <section class="panel-block">
                <h2 class="block-title"><i class="fa-solid fa-check"></i> Approuvés</h2>
                <div id="admin-testi-approved" class="item-list">
                    <p class="subtext">Chargement...</p>
                </div>
            </section>
        </div>

        <div id="tab-members" class="tab-panel">
            <section class="panel-block">
                <button id="btn-add-member" class="btn-primary" style="margin-bottom:16px;">
                    <i class="fa-solid fa-plus"></i> Ajouter un membre
                </button>
                <div id="admin-members-list" class="item-list">
                    <p class="subtext">Chargement...</p>
                </div>
            </section>
        </div>

        <div id="tab-contact" class="tab-panel">
            <section class="panel-block">
                <h2 class="block-title"><i class="fa-brands fa-whatsapp"></i> Numéros WhatsApp</h2>
                <div class="field">
                    <label>Ligne 1</label>
                    <input type="text" id="contact-tel1" placeholder="+228 97 66 80 21">
                </div>
                <div class="field">
                    <label>Ligne 2</label>
                    <input type="text" id="contact-tel2" placeholder="+228 70 00 25 39">
                </div>
            </section>

            <section class="panel-block">
                <h2 class="block-title"><i class="fa-solid fa-share-nodes"></i> Réseaux sociaux</h2>
                <div class="field">
                    <label>Lien YouTube</label>
                    <input type="text" id="contact-youtube" placeholder="https://www.youtube.com/@jobandofficiel">
                </div>
                <div class="field">
                    <label>Lien TikTok</label>
                    <input type="text" id="contact-tiktok" placeholder="https://www.tiktok.com/@jobandofficiel">
                </div>
                <div class="field">
                    <label>Lien Chaîne WhatsApp</label>
                    <input type="text" id="contact-wa-channel" placeholder="https://whatsapp.com/channel/...">
                </div>
            </section>

            <button id="btn-save-contact" class="btn-primary">Enregistrer</button>
            <p id="contact-form-status" class="status-msg"></p>
                        </div>
        <div id="member-form-overlay" class="form-overlay hidden">
            <div class="form-modal">
                <h2 id="member-form-title" class="block-title">Nouveau membre</h2>

                <input type="hidden" id="member-id">

                <div class="field">
                    <label>Nom</label>
                    <input type="text" id="member-name">
                </div>
                <div class="field">
                    <label>Rôle</label>
                    <input type="text" id="member-role">
                </div>
                <div class="field">
                    <label>Description (optionnel)</label>
                    <input type="text" id="member-description">
                </div>
                <div class="field">
                    <label>Photo</label>
                    <input type="file" id="member-photo-file" accept="image/*">
                    <input type="hidden" id="member-image-url">
                    <p id="member-photo-status" class="subtext" style="margin:6px 0 0;"></p>
                    <img id="member-photo-preview" src="" style="display:none; max-width:100px; border-radius:8px; margin-top:8px;">
                </div>
                <div class="field">
                    <label>Ordre d'affichage (0 = premier)</label>
                    <input type="number" id="member-order" value="0">
                </div>
                <div class="field" style="display:flex; align-items:center; gap:10px;">
                    <input type="checkbox" id="member-active" checked style="width:auto;">
                    <label style="margin:0;">Membre actif (visible sur le site)</label>
                </div>

                <button id="btn-save-member" class="btn-primary">Enregistrer</button>
                <button id="btn-cancel-member" class="btn-logout" style="margin-top:8px;">Annuler</button>
                <p id="member-form-status" class="status-msg"></p>
            </div>
        </div>
    </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="config-system-v5.js"></script>

</body>
</html>
