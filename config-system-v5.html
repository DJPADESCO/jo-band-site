<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>404 - Page non trouvée</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, sans-serif;
        background: #0a1128;
        color: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .login-box {
        background: #112240;
        border: 1px solid rgba(212,175,55,0.2);
        border-radius: 14px;
        padding: 30px 24px;
        width: 100%;
        max-width: 360px;
    }
    .login-box h1 {
        color: #d4af37;
        font-size: 1.2rem;
        margin-bottom: 20px;
        text-align: center;
    }
    .field { margin-bottom: 16px; }
    .field label {
        display: block;
        font-size: 0.82rem;
        color: #8892b0;
        margin-bottom: 6px;
    }
    .field input {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid rgba(212,175,55,0.25);
        background: rgba(255,255,255,0.05);
        color: #fff;
        font-size: 0.95rem;
    }
    .btn-login {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: none;
        background: #d4af37;
        color: #0a1128;
        font-weight: bold;
        font-size: 0.95rem;
        cursor: pointer;
        margin-top: 6px;
    }
    .btn-login:disabled { opacity: 0.6; }
    .status-msg {
        margin-top: 14px;
        font-size: 0.85rem;
        text-align: center;
        min-height: 1.2em;
    }
    .status-msg.error   { color: #ff4444; }
    .status-msg.success { color: #25D366; }
    .admin-panel { display: none; text-align: center; }
    .admin-panel.visible { display: block; }
    .admin-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        border-bottom: 1px solid rgba(212,175,55,0.15);
    }
    .admin-tab-btn {
        background: none;
        border: none;
        color: #8892b0;
        padding: 8px 12px;
        font-size: 0.85rem;
        cursor: pointer;
        border-bottom: 2px solid transparent;
    }
    .admin-tab-btn.active {
        color: #d4af37;
        border-bottom-color: #d4af37;
        font-weight: bold;
    }
    .admin-tab-content { display: none; }
    .admin-tab-content.active { display: block; }
    .admin-section-title {
        color: #d4af37;
        font-size: 0.95rem;
        margin: 16px 0 10px;
        text-align: left;
    }
    .admin-item-card {
        background: rgba(255,255,255,0.04);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 10px;
    }
    .admin-item-text { font-size: 0.88rem; margin-bottom: 6px; }
    .admin-item-meta { font-size: 0.78rem; color: #d4af37; margin-bottom: 10px; }
    .admin-btn-approve, .admin-btn-delete {
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 0.78rem;
        margin-right: 8px;
        cursor: pointer;
    }
    .admin-btn-approve { background: #25D366; color: #fff; }
    .admin-btn-delete  { background: #ff4444; color: #fff; }
</style>
</head>
<body>

<div class="login-box">
    <div id="login-view">
        <h1>🔒 Accès restreint</h1>
        <div class="field">
            <label for="admin-email">Email</label>
            <input type="email" id="admin-email" autocomplete="username">
        </div>
        <div class="field">
            <label for="admin-password">Mot de passe</label>
            <input type="password" id="admin-password" autocomplete="current-password">
        </div>
        <button id="btn-login" class="btn-login">Se connecter</button>
        <p id="login-status" class="status-msg"></p>
    </div>

    <div id="totp-view" class="admin-panel">
        <h1>🔐 Code de vérification</h1>
        <p style="color:#8892b0; font-size:0.85rem; margin-bottom:16px;">
            Ouvrez Google Authenticator et entrez le code à 6 chiffres.
        </p>
        <div class="field">
            <input type="text" id="totp-code" maxlength="6" placeholder="123456" style="text-align:center; font-size:1.3rem; letter-spacing:4px;">
        </div>
        <button id="btn-verify-totp" class="btn-login">Vérifier</button>
        <p id="totp-status" class="status-msg"></p>
    </div>

    <div id="admin-view" class="admin-panel">
        <h1>⚙️ Panneau Admin JO BAND</h1>

        <div class="admin-tabs">
            <button class="admin-tab-btn active" data-tab="tab-testimonials">Témoignages</button>
        </div>

        <div id="tab-testimonials" class="admin-tab-content active">
            <h3 class="admin-section-title">📝 En attente</h3>
            <div id="admin-testi-pending" style="text-align:left;">
                <p style="color:#8892b0; font-size:0.85rem;">Chargement...</p>
            </div>

            <h3 class="admin-section-title">✅ Déjà approuvés</h3>
            <div id="admin-testi-approved" style="text-align:left;">
                <p style="color:#8892b0; font-size:0.85rem;">Chargement...</p>
            </div>
        </div>

        <button id="btn-logout" class="btn-login" style="background:transparent; border:1px solid #d4af37; color:#d4af37; margin-top:20px;">
            Se déconnecter
        </button>
    </div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script>
    firebase.initializeApp({
        apiKey:            'AIzaSyDol8OdWq6YoBY5XMyuPYue25mQnOoIOYE',
        authDomain:        'jo-band-notifications-aea69.firebaseapp.com',
        projectId:         'jo-band-notifications-aea69',
        storageBucket:     'jo-band-notifications-aea69.firebasestorage.app',
        messagingSenderId: '942336247693',
        appId:             '1:942336247693:web:4a0f5915907c911d671fc4'
    });

    var loginView  = document.getElementById('login-view');
    var adminView  = document.getElementById('admin-view');
    var btnLogin   = document.getElementById('btn-login');
    var btnLogout  = document.getElementById('btn-logout');
    var statusMsg  = document.getElementById('login-status');

    var totpView     = document.getElementById('totp-view');
    var btnVerifyTotp = document.getElementById('btn-verify-totp');
    var totpStatus    = document.getElementById('totp-status');
    var totpVerified  = sessionStorage.getItem('jb_totp_verified') === 'true';

    firebase.auth().onAuthStateChanged(function (user) {
        if (user && totpVerified) {
            loginView.style.display = 'none';
            totpView.classList.remove('visible');
            adminView.classList.add('visible');
        } else if (user && !totpVerified) {
            loginView.style.display = 'none';
            totpView.classList.add('visible');
            adminView.classList.remove('visible');
        } else {
            loginView.style.display = 'block';
            totpView.classList.remove('visible');
            adminView.classList.remove('visible');
        }
    });

    btnVerifyTotp.addEventListener('click', function () {
        var code = document.getElementById('totp-code').value.trim();
        if (!code) return;

        btnVerifyTotp.disabled = true;
        btnVerifyTotp.textContent = 'Vérification...';

        fetch('/api/verify-totp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: code })
        })
            .then(function (r) { return r.json(); })
            .then(function (result) {
                if (result.success) {
                    sessionStorage.setItem('jb_totp_verified', 'true');
                    totpVerified = true;
                    totpView.classList.remove('visible');
                    adminView.classList.add('visible');
                    loadPendingTestimonials();
                } else {
                    totpStatus.textContent = result.error || 'Code incorrect.';
                    totpStatus.className = 'status-msg error';
                }
            })
            .catch(function () {
                totpStatus.textContent = 'Erreur de connexion, réessayez.';
                totpStatus.className = 'status-msg error';
            })
            .finally(function () {
                btnVerifyTotp.disabled = false;
                btnVerifyTotp.textContent = 'Vérifier';
            });
    });

    btnLogin.addEventListener('click', function () {
        var email    = document.getElementById('admin-email').value.trim();
        var password = document.getElementById('admin-password').value;

        if (!email || !password) {
            statusMsg.textContent = 'Merci de remplir tous les champs.';
            statusMsg.className = 'status-msg error';
            return;
        }

        btnLogin.disabled = true;
        btnLogin.textContent = 'Connexion...';
        statusMsg.textContent = '';

        firebase.auth().signInWithEmailAndPassword(email, password)
            .catch(function (error) {
                statusMsg.textContent = 'Identifiants incorrects.';
                statusMsg.className = 'status-msg error';
            })
            .finally(function () {
                btnLogin.disabled = false;
                btnLogin.textContent = 'Se connecter';
            });
    });

    function loadTestimonials(status) {
        var containerId = status === 'approved' ? 'admin-testi-approved' : 'admin-testi-pending';
        var container = document.getElementById(containerId);

        firebase.auth().currentUser.getIdToken().then(function (idToken) {
            fetch('/api/admin-testimonials?status=' + status, {
                headers: { 'Authorization': 'Bearer ' + idToken }
            })
                .then(function (r) { return r.json(); })
                .then(function (result) {
                    if (!result.success || !result.data.length) {
                        container.innerHTML = '<p style="color:#8892b0; font-size:0.85rem;">' +
                            (status === 'approved' ? 'Aucun témoignage approuvé.' : 'Aucun témoignage en attente.') +
                            '</p>';
                        return;
                    }

                    container.innerHTML = result.data.map(function (t) {
                        var approveBtn = status === 'pending'
                            ? '<button class="admin-btn-approve" data-id="' + t.id + '">Approuver</button>'
                            : '';
                        return '' +
                            '<div class="admin-item-card">' +
                                '<p class="admin-item-text">' + t.message + '</p>' +
                                '<p class="admin-item-meta">— ' + t.name + ' (' + t.rating + '⭐)</p>' +
                                approveBtn +
                                '<button class="admin-btn-delete" data-id="' + t.id + '">Supprimer</button>' +
                            '</div>';
                    }).join('');

                    container.querySelectorAll('.admin-btn-approve').forEach(function (btn) {
                        btn.addEventListener('click', function () {
                            var id = btn.getAttribute('data-id');
                            if (confirm('Voulez-vous approuver ce témoignage ? Il deviendra visible publiquement sur le site.')) {
                                updateTestimonial(id, 'approve', status);
                            }
                        });
                    });
                    container.querySelectorAll('.admin-btn-delete').forEach(function (btn) {
                        btn.addEventListener('click', function () {
                            var id = btn.getAttribute('data-id');
                            if (confirm('Voulez-vous vraiment supprimer ce témoignage définitivement ?')) {
                                updateTestimonial(id, 'delete', status);
                            }
                        });
                    });
                });
        });
    }

    function updateTestimonial(id, action, status) {
        firebase.auth().currentUser.getIdToken().then(function (idToken) {
            fetch('/api/admin-testimonials', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + idToken
                },
                body: JSON.stringify({ id: id, action: action })
            }).then(function () {
                loadTestimonials('pending');
                loadTestimonials('approved');
            });
        });
    }

    document.querySelectorAll('.admin-tab-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            document.querySelectorAll('.admin-tab-btn').forEach(function (b) { b.classList.remove('active'); });
            document.querySelectorAll('.admin-tab-content').forEach(function (c) { c.classList.remove('active'); });
            btn.classList.add('active');
            document.getElementById(btn.getAttribute('data-tab')).classList.add('active');
        });
    });
    btnLogout.addEventListener('click', function () {
        sessionStorage.removeItem('jb_totp_verified');
        firebase.auth().signOut();
    });
</script>

</body>
</html>
